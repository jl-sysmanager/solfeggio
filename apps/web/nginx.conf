# Plantilla procesada por envsubst al arrancar (imagen oficial nginx: /etc/nginx/templates).
# Variables:
#   PORT          puerto de escucha (80 por defecto; Railway lo inyecta)
#   API_UPSTREAM  origen del API (p. ej. http://api:3000 o http://api.railway.internal:3000)
#   API_HOST      cabecera Host hacia el API ($host por defecto; el dominio del API si se usa su URL pública)
#   S3_ORIGIN     origen(es) de las URLs prefirmadas, admite comodines (p. ej. https://*.storage.railway.app)
# NGINX_LOCAL_RESOLVERS lo calcula el entrypoint de la imagen a partir de /etc/resolv.conf.
server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    # Resolución en tiempo de ejecución: si el API se redespliega y cambia de IP, nginx no sigue usando la antigua.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # frame-src blob: permite previsualizar PDF/imagen con object URL (evitar iframe directo a S3, que Chrome deja en blanco).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: ${S3_ORIGIN}; media-src 'self' blob: ${S3_ORIGIN}; connect-src 'self' ${S3_ORIGIN}; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; base-uri 'self'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Las métricas de Prometheus sólo se consultan por la red interna, nunca a través de la web pública.
    location = /api/v1/metrics {
        return 404;
    }

    location /api/ {
        # Con variable, proxy_pass conserva la ruta original (/api/v1/...) y resuelve el nombre con `resolver`.
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # El cuerpo de los webhooks de Stripe debe llegar intacto para verificar la firma.
        proxy_request_buffering on;
    }

    # Recursos con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.map$ {
        return 404;
    }

    # SPA: cualquier otra ruta sirve index.html, que nunca se cachea.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # frame-src blob: permite previsualizar PDF/imagen con object URL (evitar iframe directo a S3, que Chrome deja en blanco).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: ${S3_ORIGIN}; media-src 'self' blob: ${S3_ORIGIN}; connect-src 'self' ${S3_ORIGIN}; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
