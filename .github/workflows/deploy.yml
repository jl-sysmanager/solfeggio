name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/solfeggio

jobs:
  build:
    name: Build & push (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          docker run --rm -e DATABASE_MIGRATION_URL -e DATABASE_URL="$DATABASE_MIGRATION_URL" \
            "$IMAGE_PREFIX-api:$IMAGE_TAG" npx prisma migrate deploy
      - name: Rolling update
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Desplegar $IMAGE_TAG en staging"
          # Ejemplo con SSH + docker compose (sustituir por ECS/Cloud Run/k8s):
          # install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$DEPLOY_SSH_KEY"
          # ssh -o StrictHostKeyChecking=accept-new deploy@"$DEPLOY_HOST" \
          #   "cd /srv/solfeggio && IMAGE_TAG=$IMAGE_TAG docker compose pull && \
          #    IMAGE_TAG=$IMAGE_TAG docker compose up -d --no-deps api worker web"
      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then curl -fsS "$STAGING_URL/api/v1/health/ready"; fi

  deploy-production:
    name: Deploy producción
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Requiere aprobación manual configurada en el environment "production".
    environment: production
    concurrency: deploy-production
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          docker run --rm -e DATABASE_MIGRATION_URL -e DATABASE_URL="$DATABASE_MIGRATION_URL" \
            "$IMAGE_PREFIX-api:$IMAGE_TAG" npx prisma migrate deploy
      - name: Rolling update
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Desplegar $IMAGE_TAG en producción"
          # Igual que staging, contra el host/cluster de producción.
      - name: Smoke test
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then curl -fsS "$PRODUCTION_URL/api/v1/health/ready"; fi
