name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solfeggio/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck

  api-test:
    name: API — tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solfeggio
          POSTGRES_PASSWORD: solfeggio
          POSTGRES_DB: solfeggio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solfeggio" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    env:
      # Credenciales efímeras solo para CI.
      DATABASE_URL: postgresql://solfeggio_app:solfeggio_app@localhost:5432/solfeggio_test
      SYSTEM_DATABASE_URL: postgresql://solfeggio:solfeggio@localhost:5432/solfeggio_test
      DATABASE_MIGRATION_URL: postgresql://solfeggio:solfeggio@localhost:5432/solfeggio_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Crear rol de aplicación y base de datos de test
        env:
          PGHOST: localhost
          PGPASSWORD: solfeggio
          POSTGRES_USER: solfeggio
          POSTGRES_DB: solfeggio
          APP_DB_USER: solfeggio_app
          APP_DB_PASSWORD: solfeggio_app
        run: sh infra/postgres/01-app-role.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solfeggio/api exec prisma generate
      - run: pnpm --filter @solfeggio/api db:migrate
      - run: pnpm --filter @solfeggio/api test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  web:
    name: Web — tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solfeggio/web test --if-present
      - run: pnpm --filter @solfeggio/web build

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Bloquea por vulnerabilidades altas/críticas en dependencias de producción.
      - run: pnpm audit --prod --audit-level high
      # Informativo: moderadas no bloquean.
      - run: pnpm audit --prod --audit-level moderate
        continue-on-error: true

  docker:
    name: Build de imágenes
    runs-on: ubuntu-latest
    needs: [lint, api-test, web]
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
